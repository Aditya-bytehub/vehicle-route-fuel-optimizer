<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>All Routes · RouteForge Admin</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body
    data-page="admin"
    data-title="All Routes"
    data-subtitle="Inspect route activity across all demo users."
  >
    <div class="app-layout">
      <aside id="sidebar" class="sidebar">
        <div class="brand">
          <span class="brand-mark">R</span
          ><span
            >RouteForge
            <small style="font-size: 9px; color: #ff8559">ADMIN</small></span
          >
        </div>
        <div class="nav-label">SYSTEM</div>
        <a class="side-link active" href="admin-dashboard.html"
          >⌂ <span>Command Center</span></a
        ><a class="side-link" href="admin-users.html">◎ <span>Users</span></a
        ><a class="side-link" href="admin-routes.html"
          >▣ <span>All Routes</span></a
        ><a class="side-link" href="admin-urgent.html">! <span>Urgent</span></a
        ><a class="side-link" href="admin-late.html"
          >⚠ <span>Late Deliveries</span></a
        ><a class="side-link" href="admin-analytics.html"
          >◒ <span>Analytics</span></a
        >
        <div class="side-spacer"></div>
        <button class="side-link logout-btn" id="logout-btn">
          ↪ <span>Logout</span>
        </button>
      </aside>
      <main class="main">
        <header class="topbar">
          <div>
            <h1 id="page-title" class="page-title">All Routes</h1>
            <p id="page-subtitle" class="page-subtitle">
              Inspect route activity across all demo users.
            </p>
          </div>
          <div class="top-actions">
            <span class="user-chip" id="top-user">Admin</span>
          </div>
        </header>
        <section class="glass section-card">
          <div class="route-table-wrap">
            <table class="route-table">
              <thead>
                <tr>
                  <th>User</th>
                  <th>Route</th>
                  <th>Stops</th>
                  <th>Distance</th>
                  <th>Fuel</th>
                  <th>Cost</th>
                  <th>On-time</th>
                </tr>
              </thead>
              <tbody id="admin-route-list"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <script src="../js/optimizer.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
