<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vehicles · RouteForge</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body
    data-page="vehicles"
    data-title="Vehicles"
    data-subtitle="Manage mileage, fuel price, capacity and average speed."
  >
    <div class="app-layout">
      <aside id="sidebar" class="sidebar"></aside>
      <main class="main">
        <header class="topbar">
          <div>
            <h1 id="page-title" class="page-title">Vehicles</h1>
            <p id="page-subtitle" class="page-subtitle">
              Manage mileage, fuel price, capacity and average speed.
            </p>
          </div>
          <div class="top-actions">
            <span class="user-chip" id="top-user"></span
            ><a href="plan-route.html" class="btn btn-primary">+ New Route</a>
          </div>
        </header>
        <div
          class="grid"
          style="grid-template-columns: 0.8fr 1.5fr; align-items: start"
        >
          <section class="glass section-card">
            <div class="section-head"><h2>Add vehicle</h2></div>
            <form id="vehicle-form" class="form-grid">
              <div class="field">
                <label>Name</label><input id="v-name" required />
              </div>
              <div class="field">
                <label>Registration</label><input id="v-reg" required />
              </div>
              <div class="field">
                <label>Fuel</label
                ><select id="v-fuel">
                  <option>Petrol</option>
                  <option>Diesel</option>
                  <option>CNG</option>
                  <option>Electric</option>
                </select>
              </div>
              <div class="field">
                <label>Mileage km/L</label
                ><input
                  id="v-mileage"
                  type="number"
                  min="1"
                  value="15"
                  required
                />
              </div>
              <div class="field">
                <label>Fuel price ₹/L</label
                ><input
                  id="v-price"
                  type="number"
                  min="0"
                  value="95"
                  required
                />
              </div>
              <div class="field">
                <label>Capacity kg</label
                ><input
                  id="v-capacity"
                  type="number"
                  min="1"
                  value="1000"
                  required
                />
              </div>
              <div class="field">
                <label>Speed km/h</label
                ><input
                  id="v-speed"
                  type="number"
                  min="1"
                  value="40"
                  required
                />
              </div>
              <button class="btn btn-primary" style="grid-column: 1/-1">
                Add vehicle
              </button>
            </form>
          </section>
          <section>
            <div id="vehicle-grid" class="grid vehicle-grid"></div>
          </section>
        </div>
      </main>
    </div>
    <script src="../js/optimizer.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/generic.js"></script>
  </body>
</html>
