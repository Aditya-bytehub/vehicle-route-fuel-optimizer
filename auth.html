<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RouteForge — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="auth-page">
      <!-- 3D canvas background -->
      <canvas id="auth-canvas"></canvas>
      <div class="auth-canvas-overlay"></div>

      <!-- Left branded panel -->
      <div class="auth-brand">
        <div class="auth-brand-content">
          <a href="./index.html" class="auth-brand-logo">
            <span class="nav-logo-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M6.7 17.3 17.3 6.7"/></svg>
            </span>
            <span class="nav-logo-text">Route<span class="text-ember">Forge</span></span>
          </a>
          <div class="auth-brand-hero">
            <h2 class="auth-brand-title">Forge the perfect<br /><span class="text-gradient-ember">delivery route.</span></h2>
            <p class="auth-brand-desc">Nearest-neighbor & 2-opt heuristics. Haversine distance. Real algorithmic work — not just a map API call.</p>
          </div>
          <div class="auth-brand-features">
            <div class="auth-brand-feature">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M6.7 17.3 17.3 6.7"/></svg>
              <span>Nearest-neighbor heuristic</span>
            </div>
            <div class="auth-brand-feature">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
              <span>2-opt edge refinement</span>
            </div>
            <div class="auth-brand-feature">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="22" x2="15" y2="22"/><line x1="4" y1="9" x2="14" y2="9"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2"/></svg>
              <span>Fuel cost projection</span>
            </div>
            <div class="auth-brand-feature">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
              <span>Cloud-saved stop sets</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Right form panel -->
      <div class="auth-form-side">
        <div class="auth-mobile-logo">
          <a href="./index.html" class="auth-logo">
            <span class="nav-logo-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M6.7 17.3 17.3 6.7"/></svg>
            </span>
            <span class="nav-logo-text">Route<span class="text-ember">Forge</span></span>
          </a>
        </div>
        <div class="auth-card">
          <!-- Toggle tabs -->
          <div class="auth-tabs">
            <button class="auth-tab active" data-mode="login">Log in</button>
            <button class="auth-tab" data-mode="signup">Sign up</button>
            <div class="auth-tab-indicator"></div>
          </div>

          <!-- Login form -->
          <form id="login-form" class="auth-form auth-form-active">
            <div class="auth-field">
              <label class="input-label" for="login-email">Email</label>
              <input type="email" id="login-email" placeholder="you@example.com" class="input" required autocomplete="email" />
            </div>
            <div class="auth-field">
              <label class="input-label" for="login-password">Password</label>
              <div class="auth-password-wrap">
                <input type="password" id="login-password" placeholder="Your password" class="input" required autocomplete="current-password" />
                <button type="button" class="auth-pw-toggle" data-target="login-password" aria-label="Show password">
                  <svg class="pw-icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="pw-icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
            </div>
            <p id="login-error" class="auth-error" style="display:none"></p>
            <button type="submit" class="btn btn-primary btn-lg btn-block auth-submit" id="login-submit">
              <span class="auth-submit-text">Log in</span>
              <span class="auth-submit-spinner" style="display:none">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
              </span>
            </button>
          </form>

          <!-- Signup form -->
          <form id="signup-form" class="auth-form" style="display:none">
            <div class="auth-field">
              <label class="input-label" for="signup-email">Email</label>
              <input type="email" id="signup-email" placeholder="you@example.com" class="input" required autocomplete="email" />
            </div>
            <div class="auth-field">
              <label class="input-label" for="signup-password">Password</label>
              <div class="auth-password-wrap">
                <input type="password" id="signup-password" placeholder="At least 6 characters" class="input" required minlength="6" autocomplete="new-password" />
                <button type="button" class="auth-pw-toggle" data-target="signup-password" aria-label="Show password">
                  <svg class="pw-icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="pw-icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
            </div>
            <div class="auth-field">
              <label class="input-label" for="signup-confirm">Confirm password</label>
              <div class="auth-password-wrap">
                <input type="password" id="signup-confirm" placeholder="Repeat your password" class="input" required minlength="6" autocomplete="new-password" />
                <button type="button" class="auth-pw-toggle" data-target="signup-confirm" aria-label="Show password">
                  <svg class="pw-icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="pw-icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
            </div>
            <p id="signup-error" class="auth-error" style="display:none"></p>
            <button type="submit" class="btn btn-primary btn-lg btn-block auth-submit" id="signup-submit">
              <span class="auth-submit-text">Create account</span>
              <span class="auth-submit-spinner" style="display:none">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
              </span>
            </button>
          </form>

          <a href="./index.html" class="auth-back">Back to home</a>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="./js/core.js"></script>
    <script type="module" src="./auth-scene.js"></script>
    <script type="module" src="./auth.js"></script>
  </body>
</html>
